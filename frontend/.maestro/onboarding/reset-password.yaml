appId: com.shadowspeak.app
tags:
  - all
---
# Reset Password: Navigate through forgot-password and reset-password screens

- launchApp:
    clearState: true

- assertVisible: "How old are you?"
- tapOn:
    text: "Continue"

- assertVisible: "Privacy & Consent"
- tapOn:
    text: "I have read and accept the Privacy Policy"
- tapOn:
    text: "Accept & Continue"

- assertVisible: "Welcome Back"
- tapOn:
    text: "Forgot Password?"
- assertVisible: "Reset Password"
- assertVisible: "Email"
- assertVisible: "Send Reset Link"

# Submit valid email to trigger success view
- tapOn:
    text: "Email"
- inputText: "e2e-test@example.com"
- tapOn:
    text: "Send Reset Link"

- assertVisible: "Check Your Email"
- assertVisible: "e2e-test@example.com"
- assertVisible: "Back to Sign In"

# Navigate back to sign in
- tapOn:
    text: "Back to Sign In"
- assertVisible: "Welcome Back"
